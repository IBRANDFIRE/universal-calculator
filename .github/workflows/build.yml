name: Universal APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP File (If present)
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Zip found, extracting..."
            unzip -o *.zip -d project_files
            if [ -d project_files/* ]; then
              cp -r project_files/*/* . 2>/dev/null || cp -r project_files/* . 2>/dev/null || true
            else
              cp -r project_files/* .
            fi
          else
            echo "No zip file detected, using repository files directly."
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Force Generate Fully Valid Google Services JSON
        run: |
          # 1. Environment files
          touch .env.example .env local.properties

          # 2. Extract dynamic package name
          PKG_NAME=$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml 2>/dev/null || grep -oP 'namespace\s+["'\'']\K[^"'\'']+' app/build.gradle* 2>/dev/null || grep -oP 'applicationId\s+["'\'']\K[^"'\'']+' app/build.gradle* 2>/dev/null || echo "com.aistudio.pocketengine.krvyp")
          echo "Building for package: $PKG_NAME"

          # 3. Create fully structured dummy google-services.json
          mkdir -p app
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "firebase_url": "https://dummy-app.firebaseio.com",
              "project_id": "dummy-app",
              "storage_bucket": "dummy-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890123456789012",
                  "android_client_info": {
                    "package_name": "$PKG_NAME"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "123456789012-dummy.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForGoogleServicesValidation00"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # 4. Debug keystore check
          if [ ! -f debug.keystore ] && [ ! -f app/debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp debug.keystore app/debug.keystore 2>/dev/null || true
          fi

      - name: Ensure Gradle Executable & Wrapper Exists
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew || true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
